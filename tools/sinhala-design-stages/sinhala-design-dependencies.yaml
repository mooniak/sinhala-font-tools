# =============================================================================
# Sinhala Design Dependency Model
# =============================================================================
# Source of truth for the dependency-based (mechanical) Sinhala font
# development process. Every design decision — a metric, a skeleton, a
# structural element, a spacing class, a mark-join convention — is introduced
# exactly ONCE by one glyph, and inherited by every later glyph that uses it.
#
# A glyph may enter a stage only when everything it depends on already exists.
# Stages are therefore an OUTPUT of this data: `build.js` validates the graph
# (parents before children, class representatives before members, test texts
# only using what exists) and regenerates the visual explainer `index.html`.
#
#   Edit this file  ->  npm run build  ->  index.html is rebuilt.
#
# This model is ORTHOGONAL to the lanka-glyphsets levels (glyphsets/*.yaml):
# levels define WHAT a font must contain; stages define IN WHAT ORDER to
# design it. Each glyph carries a `level` tag so a level target can be
# computed as a slice of the stage plan.
#
# Derived from:
#   tools/sinhala-glyph-chart/sinhala-shape-groups.yaml   (shape taxonomy)
#   tools/sinhala-glyph-chart/font-developemnt-stages.md  (draft staging)
#   tools/sinhala-glyph-chart/sinhala-anatomy.md          (anatomy terms)
# =============================================================================

meta:
  name: Sinhala Design Dependency Model
  id: sinhala-design-stages
  version: 0.1.0
  script: Sinhala (sinh)
  authors: [Pathum Egodawatta, Mooniak]
  based_on_research_by: [Pushpananda Ekanayake, Pathum Egodawatta]
  license: see repository
  glyph_naming: >
    Production glyph names follow the lanka-glyphsets namespace convention:
    "name-sinh" (e.g. ka-sinh), as defined in glyphsets/sinhala-0-kernel.yaml.
  sources:
    - "docs/sinhala-shape-groups.yaml — WIP shape taxonomy (superseded where this file disagrees)"
    - "docs/font-developemnt-stages.md — original draft staging"
    - "docs/sinhala-anatomy.md — anatomical vocabulary"
    - "docs/NotoSansSinhala.glyphspackage — production reference; behavioural classes extracted to docs/sinhala.min.yaml via extract-noto.js"

# -----------------------------------------------------------------------------
# The model: what counts as a dependency, and the rules of the game.
# Rendered verbatim into the explainer page.
# -----------------------------------------------------------------------------
model:
  dependency_types:
    - id: metric
      name: Metrics
      summary: >
        Global vertical and rhythm decisions: base height, descender depths,
        mark zones, stroke weight and contrast, counter model, spacing unit.
        Committed in Stage 0–1 and frozen; changing one later reopens every
        glyph that sits on it.
    - id: skeleton
      name: Skeletons
      summary: >
        The primary structural forms of the script — bowl, arch, double-bowl,
        trap-body, u-bottom, diagonal. Each is introduced by one archetype
        glyph; every other glyph of that family is a transformation of it.
    - id: element
      name: Structural elements
      summary: >
        Reusable visual motifs attached to skeletons — eyes, traps, loops,
        hangs, tails, forks, diagonals. A glyph may introduce AT MOST ONE new
        element over an already-designed parent. (cf. the anatomical stroke
        primitives — akshi, pāsha, grantika — in sinhala-anatomy.md)
    - id: spacing
      name: Spacing classes
      summary: >
        The similar-left-side / similar-right-side families. The FIRST designed
        member of a class (its representative) sets the sidebearing; all later
        members inherit it. Spacing becomes inheritance, not per-glyph work.
    - id: mark-form
      name: Mark-join conventions
      summary: >
        Each typographic form of a mark is its own decision: ි has a dozen-plus
        atomic form families, ු has regular, special and irregular fused
        forms, ් has four forms (kodiya flag, rahena wrap, trap and ja
        alternates). A form family is introduced by its first designed member;
        later hosts inherit the convention as they arrive.
    - id: composite
      name: Composites
      summary: >
        Pure assemblies of existing parts (ො = ෙ + ා, ේ = ෙ + ්, ෝ = ො + ්,
        ආ = අ + ා). Near-zero design cost; schedulable as soon as all parts
        exist. Whether they are built as references or GPOS is per-project
        (see glyph_construction in sinhala-shape-groups.yaml).

  rules:
    - "Introduce once: every decision (metric, skeleton, element, spacing class, mark form) has exactly one introducing glyph."
    - "Inherit afterwards: later glyphs may only USE decisions that already exist."
    - "One new thing at a time: a glyph introduces at most one new element over its parents."
    - "Representatives first: a spacing class member may not be designed before its representative."
    - "Freeze at the gate: a stage's glyphs are frozen when the stage gate passes. Editing a frozen glyph formally reopens ALL its descendants."
    - "Test with what exists: stage test texts may only use glyphs and mark forms scheduled at or before that stage. The build validates this mechanically."
    - "Stages are computed conclusions, not opinions: if the data changes, rebuild; the document must never disagree with the graph."

  gates:
    - "Every new glyph sits correctly in its spacing class (check against the class representative)."
    - "The stage drill strings read with even colour and rhythm at text size."
    - "The stage word list and sentences (real Sinhala) read naturally."
    - "All new metrics/elements introduced this stage are reviewed and frozen."
    - "No open validation errors from `npm run build`."

# -----------------------------------------------------------------------------
# Machine guidance: how an AI font-generation tool should consume this file.
# -----------------------------------------------------------------------------
ai_guidance:
  purpose: >
    This file is a machine-readable build plan for a Sinhala font. An AI
    drawing agent (or a human) can follow it glyph by glyph and always know
    what already exists, what each glyph is derived from, and how to verify
    the result.
  algorithm:
    - "1. Sort glyph entries by (stage, order)."
    - "2. Before drawing glyph G: assert every entry in G.parents is already drawn and frozen; assert every metric in G.requires is decided."
    - "3. Draw G per ai.construction, reusing outlines/components of parents wherever possible (G is a transformation of its parents, not a new drawing)."
    - "4. Space G by copying the sidebearings of its spacing-class representatives (spacing.left / spacing.right reps); only representatives get bespoke spacing."
    - "5. Run G through ai.checks and the stage test texts; render tests must use ONLY glyphs scheduled so far."
    - "6. At each stage gate, freeze the stage. If any frozen glyph is later modified, re-open and re-verify every descendant (transitive closure over parents)."
  form_families: >
    Entries of type form-family are single design decisions covering many
    combinations (e.g. the කි family fixes how ි sits on ක ත න). Draw the
    family archetype first (first host listed), then apply the same convention
    to remaining hosts as they become available. Hosts not yet assigned to any
    ි family (ම ය ව බ ඛ ධ ණ) are open taxonomy gaps: compose them provisionally
    and flag them for the designer.
  construction_note: >
    ai.construction fields describe the DERIVATION (what to reuse and what to
    change), not exact outlines. Aesthetic interpretation is the type
    designer's / model's, within the frozen metrics.
  output_conventions:
    glyph_names: "name-sinh (see glyphsets/sinhala-0-kernel.yaml)"
    units_per_em: project-defined
    shaping: "OpenType sinh/sin2; conjunct forms in Stage 9 need ZWJ-aware substitutions (see tools/feature-generator)."
  do_not:
    - "Do not draw a glyph before its parents (topological order is mandatory)."
    - "Do not give a non-representative glyph bespoke sidebearings without flagging it as a spacing-class exception."
    - "Do not emit test strings containing glyphs not yet scheduled."
    - "Do not silently resolve taxonomy gaps (see `gaps`); surface them."

# -----------------------------------------------------------------------------
# Stage 0 decisions: metrics. `committed_by` names the glyph that makes the
# decision real on paper.
# -----------------------------------------------------------------------------
metrics:
  base_height:   {name: Base height,            committed_by: ස, stage: 0, description: "Height of the letter body (the Sinhala 'x-height'). Nearly every glyph lives here. Decided on ස's body top — in multi-script fonts tuned near the Latin x-height (similar, never 100% matching). ට's bowl ascends above this band, so it is not the anchor."}
  stroke:        {name: Stroke weight & contrast, committed_by: ට, stage: 0, description: "Main stroke thickness, thick/thin axis and modulation model."}
  counter:       {name: Counter model,          committed_by: ට, stage: 0, description: "Interior white: aperture size, counter proportions, rounding radius."}
  spacing_unit:  {name: Spacing unit,           committed_by: ට, stage: 0, description: "The default sidebearing rhythm every spacing class is tuned against."}
  overshoot:     {name: Overshoot,              committed_by: ට, stage: 0, description: "How far round strokes cross the baseline / base height."}
  mark_height:   {name: Above-mark zone,        committed_by: ි, stage: 1, description: "Ceiling and clearance for ි ී and the ් flag."}
  mark_depth:    {name: Below-mark depth,       committed_by: ු, stage: 1, description: "Depth of ු ූ (and later ෘ ෲ). Distinct from consonant tail depth."}
  tail_depth:    {name: Consonant tail depth,   committed_by: ඩ, stage: 1, description: "Descender depth of consonant tails (ඩ ඬ etc.)."}
  hook_depth:    {name: Aeda-pilla depth,       committed_by: ැ, stage: 4, description: "Depth of the ැ ෑ hooks below the baseline."}
  conjunct_depth: {name: Conjunct depth,        committed_by: rakaransaya, stage: 9, description: "Depth budget for ්‍ර and stacked/touching conjuncts."}

# -----------------------------------------------------------------------------
# Skeletons: primary structural forms, each introduced by one archetype glyph.
# -----------------------------------------------------------------------------
skeletons:
  bowl:        {name: Bowl,        introduced_by: ට, description: "Single open bowl on the baseline; the script's core curve."}
  trap_body:   {name: Trap body,   introduced_by: එ, description: "The open-top 'trap' body shared by එ ඒ ඨ ඪ ඵ (yaml එ-group)."}
  double_bowl: {name: Double bowl, introduced_by: ප, description: "Two joined bowls; base of the wide ප family."}
  arch:        {name: Arch,        introduced_by: ග, description: "The arch with the shared right terminal of ක ත ග ණ න භ ශ හ — the largest family in the script."}
  u_bottom:    {name: U-bottom,    introduced_by: ද, description: "The open under-curve shared by අ උ ද ඳ (yaml උ-group)."}
  diagonal:    {name: Diagonal,    introduced_by: ර, description: "The diagonal-stroke system of ර and its irregular combined forms (yaml ර-group)."}

# -----------------------------------------------------------------------------
# Structural elements (yaml `elements` + tail and fork). `anatomy` maps to the
# stroke-primitive vocabulary collected in sinhala-anatomy.md where honest.
# -----------------------------------------------------------------------------
elements:
  eye_line: {name: Eye-line entry, introduced_by: ස, anatomy: "cf. Akshi (eye) + entry stroke", members: [එ, ච, ඩ, ඝ, ඪ, භ, ස], description: "The left entry that runs into a small eye, shared by the එ ච ඩ ඝ ඪ භ ස left family."}
  tail:     {name: Tail,           introduced_by: ඩ, anatomy: "Avarohana (descender) + Grantika (knot)", members: [ඩ, ඪ, ඬ], description: "Knotted descender below the baseline. Commits tail_depth."}
  trap:     {name: Trap,           introduced_by: ඪ, anatomy: "open counter form", members: [එ, ඒ, ඨ, ථ, ඪ, ඵ, ව], description: "The open-top trap counter. Introduced on ඪ, archetype body is එ."}
  eye_ka:   {name: Ka-eye,         introduced_by: ත, anatomy: "Akshi (eye)", members: [ක, ත, න, භ, හ], description: "The closed eye of the arch family."}
  fork:     {name: Fork,           introduced_by: ය, anatomy: "internal divider", members: [ය], description: "The internal divider that turns ප into ය."}
  loop:     {name: Loop,           introduced_by: ඔ, anatomy: "Pāsha (loop)", members: [ඔ, ම, ඹ], description: "The closed loop of ඔ ම ඹ."}
  hang:     {name: Hang,           introduced_by: ඳ, anatomy: "descending Pāsha", members: [ඤ, ඥ, ඟ, ඬ, ඳ], description: "The hanging tail of the prenasalized/nasal set."}
  diagonal: {name: Diagonal stroke, introduced_by: ර, anatomy: "inclined Bāhuva (stem)", members: [ජ, ඡ, ඦ, ණ, ර, ඊ], description: "The diagonal stroke system; also the whole ර combined-form family."}
  twin_body: {name: Twin body,     introduced_by: ඣ, anatomy: "Gaṇḍa (hump) + dvivakra sandi", members: [ඣ], description: "Two letter bodies fused side by side sharing a joint — the construction of ඣ and of the ligated conjuncts (න්‍ද ත්‍ථ ක්‍ව ග්‍ධ …), which inherit it in Stage 9. Noto groups ඣ with the fused conjuncts in its OT classes."}

# -----------------------------------------------------------------------------
# Spacing classes, from similar_left_side / similar_right_side in
# sinhala-shape-groups.yaml. `rep` = the first-designed member; it sets the
# sidebearing that all other members inherit.
# Source overlaps (a glyph in two groups) are resolved to ONE primary class;
# the secondary membership is kept as data and listed under `gaps`.
# -----------------------------------------------------------------------------
spacing_classes:
  right:
    R-bowl:  {rep: ට, members: [ට, ච, ධ, ව, ඩ, ඣ]}
    R-trap:  {rep: ඪ, members: [ඨ, ථ, එ, ඪ, ඵ]}
    R-pa:    {rep: ස, members: [ප, ය, ඝ, ස, ෂ]}
    R-arch:  {rep: ග, members: [ක, ත, ග, ඟ, ණ, න, භ, ශ, හ, ෆ, ඉ, ා, ෘ, ෟ]}
    R-diag:  {rep: ර, members: [ජ, ඦ, ර, ඊ]}
    R-a:     {rep: අ, members: [අ, ල, ළ]}
    R-u:     {rep: ද, members: [උ, ද, ඤ, ඥ, ඳ, ැ, ෑ]}
    R-round: {rep: ඔ, members: [ඔ, ඕ, ඛ, බ, ම, ඹ, ඬ], note: "Source also lists ධ ච ඩ ඣ here; their primary class is R-bowl."}
  left:
    L-tta:   {rep: ට, members: [ට, ධ, ඛ, බ]}
    L-e:     {rep: ස, members: [එ, ච, ඩ, ඝ, ඪ, භ, ස], note: "ස also appears in L-pa in the source; primary here."}
    L-ja:    {rep: ය, members: [ජ, ඨ, ථ, ය, ර, ඊ, ල, ඉ, ළ, ෆ]}
    L-pa:    {rep: ප, members: [අ, උ, ප, ඡ, ද, ව, හ, ඵ, ෂ]}
    L-ka:    {rep: ත, members: [ක, ත, ණ, න, ඣ]}
    L-ga:    {rep: ග, members: [ග, ඟ, ඤ, ඥ, ඦ, ශ, ඬ, ඳ, ඏ, ෙ]}
    L-o:     {rep: ඔ, members: [ඔ, ඕ, ම, ඹ]}

# -----------------------------------------------------------------------------
# Mark systems. The ි form families come from `ligatures` in
# sinhala-shape-groups.yaml; each family is ONE design decision (an entry of
# type form-family in `glyphs`). This block is the overview.
# -----------------------------------------------------------------------------
mark_systems:
  ispilla:
    mark: ි
    long: ී
    note: >
      ි has three-plus typographic forms. Every base+ි combination should be
      atomically designed for quality (glyph_construction note in
      sinhala-shape-groups.yaml). Families below are scheduled independently,
      each introduced by its first designed member.
    families: [fam-i-tti, fam-i-tthi, fam-i-ghi, fam-i-ki, fam-i-gi, fam-i-di, fam-i-li, fam-i-pi, fam-i-ji, fam-i-bhi, fam-i-ndi, fam-i-nyi, fam-i-term]
    unassigned_hosts: []
    noto_evidence: >
      The formerly-unassigned hosts (ම ය ව බ ඛ ධ ණ …) are FUSED-ligature
      hosts in Noto Sans Sinhala (mI-sinh, yI-sinh …): bases whose top
      terminal forces the ි loop to wrap, the same top-terminal logic as the
      rahena ් form. Modeled as fam-i-term. See docs/sinhala.min.yaml.
  papilla:
    mark: ු
    long: ූ
    note: >
      Two typographic forms: the regular below-join (introduced Stage 1 on ස)
      and the special right-joined form on ක ග ත භ ශ ඟ (entry u-special,
      Stage 4). රු රූ belong to the ර system. දු and ළු are irregular fused
      forms of their own (entries du-form and llu-form) — ළු is visually a
      trap-family shape (එ ඵ with the ඪ-style top trap), not ළ plus a mark.
      NOTE: Noto reveals a richer four-tier ු system (default + three
      contextual alternates + a larger fused set incl. ලු ඳු ඤු ඥු) that this
      model does not yet encode — see gap u-system-noto.
  halkirima:
    mark: ්
    note: >
      FOUR forms (designer terminology + confirmed by Noto Sans Sinhala's OT
      behaviour, docs/sinhala.min.yaml): the default KODIYA flag
      (ක්), introduced with ් in Stage 3; the RAHENA wrap for bases with a
      TOP TERMINAL (ට ඩ ඬ ච ධ ඛ බ ම ඹ ව ඣ ඞ — fused as one glyph; entry
      hal-rahena); the trap-top alternate (ඨ ඪ ථ ඵ — entry hal-trap); and
      the ja-shape alternate (ඡ ජ ඦ — entry hal-ja). ර් belongs to the ර
      system (ra-forms). The systematic sweep across all bases is Stage 8
      (entry hal-sweep).
  spacing_marks:
    body: [ා, ැ, ෑ, ෙ, ෘ, ෟ, ෛ, ො, ෝ, ෞ, ෲ, ෳ]
    above: [ි, ී, ්, ං]
    below: [ු, ූ]

# -----------------------------------------------------------------------------
# Stages: narrative, gate focus, and AUTHORED test texts (validated by build).
# Drill strings are generated by build.js from the cumulative glyph set.
# -----------------------------------------------------------------------------
stages:
  - n: 0
    name: System
    goal: >
      Decide the type system before drawing letters: base height, stroke and
      contrast, counter model, overshoot, spacing unit. Deliverable is a set
      of guides plus rough control drawings of ට and ස — ට for stroke,
      counter and overshoot; ස for base height (tuned near the Latin
      x-height in multi-script projects, never 100% matching).
    gate: "All Stage-0 metrics written down and drawn as guides."
  - n: 1
    name: Bootstrap
    goal: >
      The smallest set that commits the core decisions: the bowl, the
      body-deciding ස (its body top fixes base height — in multi-script
      projects tuned near the Latin x-height, similar but never 100%
      matching, while ට's apex ascends above the body band — and brings the
      eye-line entry and doubled-body density), the double-bowl ප, the tail
      (descender depth), the trap, and both vertical mark zones (ි above,
      ු below) with their first atomic joins (ඩි ඪි). This stage
      front-loads risk on purpose: every core metric is committed here.
    gate: "Bowl rhythm reads evenly; base height locked on ස; ඩි ඪි joins convincing; both mark depths frozen."
    teststrings:
      drills:
        - "සට සසඩඪ ටසඩි ඪිටඩසට ඩඪඩි සට ඩසට ඪඩිස ටඪඩඩි සඩඪ ඩටඪිස"
        - "පට පස සප ටපස පඩට ඪප පසඩි පටඪ"
        - "ටුසු ඩුසු සුටු ඩිටු ඪිසු පුසු ටුපු"
      words: []
      sentences: []
  - n: 2
    name: Bowl derivatives
    goal: >
      Everything that follows from Stage 1 with zero new metrics: ච (bowl +
      eye-line), එ (the trap body standing alone), ය (ප plus the fork),
      ව (bowl + trap). One new left spacing class opens (L-ja).
    gate: "All four glyphs sit in Stage-1 rhythm without touching any metric."
    teststrings:
      drills: []
      words: [වට, එය, පය, සුව, වසු, පසු, පුස]
      sentences: []
  - n: 3
    name: Arch family and spacing marks
    goal: >
      The arch — the script's biggest family — enters via ග, with ා designed
      alongside it (they share the same right terminal). ත න introduce the
      ka-eye. The first spacing marks (් kodiya, ෙ, ං) unlock real words,
      and the ් system branches: the rahena wrap (ට්) and the trap-top
      alternate (ඪ්) are decided against their Stage-1 hosts. The first ි
      family taken from a designed host: සි (the ඝි family, introduced by its
      first available member).
    gate: "First real Sinhala words read naturally; arch terminal and ා are indistinguishable in rhythm."
    teststrings:
      drills: []
      words: [ගත, ගස, ගස්, වත, පත, පාට, සතා, ගෙට, නෙත, වෙන, සිට, සිසු, තට්ටුව, වත්ත, වසන්තය, ගංගාව]
      sentences: []
  - n: 4
    name: High-frequency completion
    goal: >
      The stage that makes the font write Sinhala: ක ද උ අ ර ල, the hooks ැ ෑ,
      the vowel composites ආ ඇ ඈ and ේ ො ෝ ෛ, the irregular ර forms (රි ර්
      රැ), the first wave of atomic ි families (කි ගි දි ලි පි), and the
      special ු form (කු ගු තු) plus දු. Text coverage jumps to the majority
      of running Sinhala.
    gate: "Full sentences set cleanly; frequency coverage measured against a corpus, not assumed."
    teststrings:
      drills: []
      words: [අද, අත, රට, රටේ, කරනවා, අපේ, ගෙදර, කියනවා, දැන්, අවුරුදු, අකුරු, කුරුල්ලා, ලංකාව, වතුර, දරුවා, පාසල, උදේ, කවදා, එදා, දිය, පොත, ලොකු, කැලේ]
      sentences:
        - "අද උදේ අපේ දරුවා පාසලට ගියා."
        - "කිරි ටිකක් දෙන්න."
  - n: 5
    name: Loops, diagonals and long marks
    goal: >
      The loop enters via ඔ (then ම), ණ combines arch + diagonal, ජ ඡ put the
      diagonal on the ප skeleton, ඉ ථ ඨ complete the medium shapes. Long marks
      ී ූ unlock the ී forms of every family designed so far, and the
      ja-shape ් alternate arrives on ජ්.
    gate: "Loop counters match the counter model; ී ූ read as the long
      counterparts of frozen ි ු forms."
    teststrings:
      drills: []
      words: [මම, අම්මා, ඔය, ඉර, ජලය, සීනි, ඉතිං, මාමා, ණය, ගණන, මිල, ජාතික, ගාථා, කථාව, පීඨය, මොකද, ඡායා]
      sentences:
        - "අම්මා පොත කියවනවා."
        - "ඉර පායනවා."
  - n: 6
    name: Aspirates and dense derivatives
    goal: >
      Single-delta children of frozen skeletons: ධ බ ඛ on the bowl, ඕ ඹ on the
      loop, භ හ ශ ඝ ෂ on the arch/eye system, ළ ෆ ඵ ඒ ඊ ඌ completing their
      families. Spacing is pure inheritance; the density ceiling (ඝ ෂ ඹ) gets
      tested against the colour of Stage 1.
    gate: "No spacing class needed retuning; dense glyphs hold the page colour."
    teststrings:
      drills: []
      words: [බත්, බස්, හතර, හරි, හිස, භාෂාව, ඔළුව, ඕනෑ, බඩු, ඝෝෂාව, ඵලය, ඒක, ඊයේ, ඌරා, ෆෝනය, ශබ්දය]
      sentences:
        - "ඊයේ හවස අපි බත් කෑවා."
  - n: 7
    name: The hang system
    goal: >
      The hang element enters on ඳ and propagates: ඬ ඟ ඤ ඥ ඦ ඣ. The da_forms
      note applies — the bottoms of ද ඳ ඤ ඥ (and later න්‍ද) must stay
      consistent. Their ි families (ඳි, ඤ/ඥි) close the nasal set.
    gate: "Hang depth identical across the set; da-form bottoms interchangeable."
    teststrings:
      drills: []
      words: [හොඳ, කඳ, හඳ, අඬනවා, ළඟ, ඉඟුරු, දඬුවම, ඥානය, සංඥාව, මඤ්ඤොක්කා, බණ්ඩාරවෙල]
      sentences:
        - "අද රෑ අහසේ හඳ හොඳට පේනවා."
  - n: 8
    name: Completion sweep
    goal: >
      Close the base × mark matrix before conjuncts: the body-mark tail
      (ෘ ෲ ෟ ෳ and the composite ෞ), the systematic ් sweep across every base
      (kodiya / rahena / trap / ja form per assignment), and completion of
      every ි/ී family member whose host arrived after the family was frozen. Full-grid QA in the glyph chart
      tool is the gate.
    gate: "Every cell of the sinhala-glyph-chart base grid renders correctly or is a documented exception."
    teststrings:
      drills: []
      words: [කෘතිය, පෘථිවිය, ගෞරවය, ගෞතම]
      sentences:
        - "මේ කෘතිය ඉතා වටිනවා."
  - n: 9
    name: Conjunct layer
    goal: >
      The ZWJ layer: rakaransaya ්‍ර (with its exception list), yansaya ්‍ය,
      repaya ර්‍, the ක්‍ෂ ligature, the classic conjuncts (න්‍ද ත්‍ථ න්‍ථ
      ට්‍ඨ ද්‍ර), touching clusters, and the conjunct ි/ී forms (ක්‍රී ශ්‍රී
      ද්‍රි න්‍දි — the ග්‍රි group of the shape taxonomy). Per-glyph
      atomic-vs-GPOS decisions are recorded here.
    gate: "Shaping-engine tests pass (sinh/sin2); every conjunct either drawn, composed, or a documented exclusion."
    teststrings:
      drills: []
      words: [ශ්‍රී, ක්‍රමය, විද්‍යාව, ප්‍රශ්නය, ධර්‍මය, සත්‍ය, චන්ද්‍රයා, ක්‍ෂණික]
      sentences:
        - "ශ්‍රී ලංකාවේ ක්‍රිකට් ක්‍රීඩාව ඉතා ප්‍රසිද්ධයි."
  - n: 10
    name: Long tail and polish
    goal: >
      The archaic and rare set (ඍ ඎ ඏ ඐ ඞ ඓ ඖ ඃ), kunddaliya ෴, punctuation
      and numeral policy, then the kerning pass across spacing-class
      representatives. Weight/width derivatives replay this same graph from
      Stage 0.
    gate: "Level target inventories (glyphsets/*.yaml) fully covered for the shipping level."
    teststrings:
      drills: []
      words: [ඍතුව, ඓතිහාසික, ඖෂධ]
      sentences:
        - "ඓතිහාසික ඖෂධ ගැන ඍජු තොරතුරු."

# -----------------------------------------------------------------------------
# GLYPHS
# type: base | vowel | mark | composite | form-family | conjunct-system | sign | process
# stage/order = design schedule. parents = design derivation (validated).
# spacing = primary class membership (reps set it, members inherit).
# level = lanka-glyphsets level tag (cross-check against glyphsets/*.yaml).
# -----------------------------------------------------------------------------
glyphs:

  # ---- Stage 1 — Bootstrap ---------------------------------------------------
  ට:
    type: base
    codepoint: 0DA7
    translit: ṭa
    stage: 1
    order: 1
    parents: []
    skeleton: bowl
    elements: []
    requires: [base_height, stroke, counter, spacing_unit, overshoot]
    spacing: {left: L-tta, right: R-bowl}
    level: sinhala-0-kernel
    frequency: medium
    ai:
      construction: >
        The control glyph. A single open bowl on the baseline: one continuous
        stroke, aperture per the counter model. Everything in the font is
        calibrated against this drawing. Note: ට's apex ascends above the
        general body area — it is deliberately taller than the base-height
        band, which ස (next) decides.
      checks:
        - "Counter reads open at text size; overshoot symmetric top/bottom."
        - "Sidebearings define the spacing unit for L-tta and R-bowl."

  ස:
    type: base
    codepoint: 0DC3
    translit: sa
    stage: 1
    order: 2
    parents: [ට]
    skeleton: bowl
    elements: [eye_line]
    requires: [base_height]
    spacing: {left: L-e, right: R-pa}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The body-deciding glyph, drawn immediately after ට: eye-line entry
        into a doubled body — the widest simple glyph and the first density
        problem. Its body top fixes base height (in multi-script projects
        tuned near the Latin x-height — similar, never 100% matching), while
        ට's apex ascends above it. Introduces the eye_line element, the L-e
        entry class and the R-pa terminal that ප ය ඝ ෂ inherit.
      checks:
        - "Base height locked on ස's body top; in a Latin companion, cross-check against the x-height (close, not equal)."
        - "Even colour beside ට at text size; L-e and R-pa sidebearings set."

  ප:
    type: base
    codepoint: 0DB4
    translit: pa
    stage: 1
    order: 3
    parents: [ට, ස]
    skeleton: double_bowl
    elements: []
    requires: [base_height]
    spacing: {left: L-pa, right: R-pa}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        Two joined bowls sitting on the base height ස decided — the flat
        double-bowl top lands exactly on the body band. Introduces the
        double_bowl skeleton and the L-pa entry that අ උ ද ව හ inherit; the
        right terminal inherits R-pa from ස.
      checks:
        - "Top of ප sits exactly on base height; two counters read even."
        - "L-pa sidebearing set; width believable next to ස."

  ඩ:
    type: base
    codepoint: 0DA9
    translit: ḍa
    stage: 1
    order: 4
    parents: [ට, ස]
    skeleton: bowl
    elements: [eye_line, tail]
    requires: [tail_depth]
    spacing: {left: L-e, right: R-bowl}
    level: sinhala-0-kernel
    frequency: medium
    ai:
      construction: >
        ට reworked with ස's eye-line left entry, plus the knotted tail below
        the baseline. Introduces the tail element and commits tail_depth.
      checks:
        - "Tail knot (grantika) doesn't clog at small sizes."
        - "Left entry matches the L-e rhythm set by ස."

  ඪ:
    type: base
    codepoint: 0DAA
    translit: ḍha
    stage: 1
    order: 5
    parents: [ඩ]
    skeleton: bowl
    elements: [trap]
    spacing: {left: L-e, right: R-trap}
    level: sinhala-0-kernel
    frequency: low
    ai:
      construction: >
        ඩ plus the trap closure on the right; its right side must land in the
        ඨ ථ එ ඵ terminal family (R-trap), which it introduces.
      checks: ["Trap counter vs bowl counter balance; R-trap sidebearing set."]

  ි:
    type: mark
    codepoint: 0DD2
    translit: i (ketti is-pilla)
    position: above
    stage: 1
    order: 6
    parents: []
    requires: [mark_height]
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The above-join convention, first typographic form only — the form that
        rides the bowl tops (ට ච ඩ class). Which of the 3+ forms this is must
        be stated in the project spec. Commits mark_height.
      checks: ["Clearance over base height; loop legible at small sizes."]

  fam-i-tti:
    type: form-family
    display: ටි ඩි (ටී චී ඩී)
    mark: ි
    hosts: [ට, ච, ඩ]
    stage: 1
    order: 7
    parents: [ට, ඩ, ි]
    level: sinhala-0-kernel
    ai:
      construction: >
        Atomic ි over the open-bowl hosts; introduced on ඩි. ච joins in
        Stage 2, the ී long forms (ටී චී ඩී) in Stage 5.
      checks: ["ඩි join reads as one drawn glyph, not a collision."]

  fam-i-tthi:
    type: form-family
    display: ඪි (ඨි ථි ඵි …)
    mark: ි
    hosts: [ඨ, ඪ, ථ, ඵ]
    stage: 1
    order: 8
    parents: [ඪ, ි]
    level: sinhala-0-kernel
    ai:
      construction: >
        Atomic ි over the trap-topped hosts; introduced on ඪි. Remaining hosts
        (ඨ ථ ඵ) complete in Stages 5–6; conjunct hosts (ට්‍ඨ ත්‍ථ න්‍ථ) in
        Stage 9.
      checks: ["The ි loop negotiates the open trap without closing it."]

  ු:
    type: mark
    codepoint: 0DD4
    translit: u (ketti paa-pilla)
    position: below
    stage: 1
    order: 9
    parents: []
    requires: [mark_depth]
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The regular below-join, tested on සු. Commits mark_depth — a shallower
        zone than tail_depth; the two must be decided together.
      checks: ["සු and ටු sit at identical depth; no collision with ඩ-type tails in setting."]

  # ---- Stage 2 — Bowl derivatives -------------------------------------------
  ච:
    type: base
    codepoint: 0DA0
    translit: ca
    stage: 2
    order: 1
    parents: [ට, ඩ]
    skeleton: bowl
    elements: [eye_line]
    spacing: {left: L-e, right: R-bowl}
    level: sinhala-0-kernel
    frequency: medium
    ai:
      construction: "ට's bowl with ඩ's eye-line entry; no tail. Pure recombination."
      checks: ["Indistinguishable rhythm from ට in a drill line."]

  එ:
    type: vowel
    codepoint: 0D91
    translit: e
    stage: 2
    order: 2
    parents: [ඪ]
    skeleton: trap_body
    elements: [eye_line, trap]
    spacing: {left: L-e, right: R-trap}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The trap body standing alone — the archetype refined from its first
        appearance on ඪ. Skeleton for ඒ ඨ ඵ later.
      checks: ["Reads as a stable independent letter, not a fragment of ඪ."]

  ය:
    type: base
    codepoint: 0DBA
    translit: ya
    stage: 2
    order: 3
    parents: [ප]
    skeleton: double_bowl
    elements: [fork]
    spacing: {left: L-ja, right: R-pa}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "ප plus the internal fork; introduces the L-ja entry class (ජ ර ල ළ ෆ … inherit)."
      checks: ["Fork doesn't darken the middle; L-ja sidebearing set."]

  ව:
    type: base
    codepoint: 0DC0
    translit: va
    stage: 2
    order: 4
    parents: [ට, ඪ]
    skeleton: bowl
    elements: [trap]
    spacing: {left: L-pa, right: R-bowl}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "Bowl with the trap element on the right; inherits everything."
      checks: ["Distinct from ච ට at a glance in the drill string."]

  fam-i-term:
    type: form-family
    display: යි වි (මි බි ණි …)
    mark: ි
    hosts: [ය, ව, ම, බ, ඛ, ධ, ණ, ඹ, ඬ, ඣ, ඞ]
    stage: 2
    order: 5
    parents: [ය, ි]
    level: sinhala-0-kernel
    ai:
      construction: >
        The top-terminal wrap ි — for bases whose top terminal forces the
        loop to wrap around it (the same top-terminal logic as the rahena ්).
        Noto Sans Sinhala fuses every one of these as a single ligature glyph
        (yI-sinh, mI-sinh …). Introduced on යි; later hosts inherit as they
        arrive.
      checks: ["Wrap negotiates each terminal without closing its counter."]

  # ---- Stage 3 — Arch family and spacing marks ------------------------------
  ්:
    type: mark
    codepoint: 0DCA
    translit: virama (al-lakuna / hal kirima)
    position: above
    stage: 3
    order: 1
    parents: []
    requires: [mark_height]
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The default KODIYA flag form (as on ක්). Three sibling decisions
        follow: the rahena wrap (hal-rahena), the trap-top alternate
        (hal-trap) and the ja-shape alternate (hal-ja).
      checks: ["Flag clears mark_height; legible after narrow and wide bases (ක් vs ස්)."]

  ග:
    type: base
    codepoint: 0D9C
    translit: ga
    stage: 3
    order: 2
    parents: []
    skeleton: arch
    elements: []
    spacing: {left: L-ga, right: R-arch}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The naked arch — introduces the skeleton and BOTH spacing classes of
        the script's largest family. The right terminal here is the exact
        model for ා.
      checks: ["R-arch terminal frozen; this stroke ending is now law for 13 glyphs and 3 marks."]

  ා:
    type: mark
    codepoint: 0DCF
    translit: aa (aela-pilla)
    position: body
    stage: 3
    order: 3
    parents: [ග]
    spacing: {right: R-arch}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "Designed WITH ග: the same right terminal, standing as a spacing mark."
      checks: ["In ගා the two terminals are twins; spacing identical to R-arch."]

  ත:
    type: base
    codepoint: 0DAD
    translit: ta
    stage: 3
    order: 4
    parents: [ග]
    skeleton: arch
    elements: [eye_ka]
    spacing: {left: L-ka, right: R-arch}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "ග plus the closed ka-eye; introduces eye_ka and the L-ka entry."
      checks: ["Eye aperture per counter model; eye joint (akshi dhāraka sandi) clean."]

  න:
    type: base
    codepoint: 0DB1
    translit: na
    stage: 3
    order: 5
    parents: [ත]
    skeleton: arch
    elements: [eye_ka]
    spacing: {left: L-ka, right: R-arch}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "ත's construction with the mid-form variation; pure sibling."
      checks: ["ත/න contrast unambiguous at text size."]

  ෙ:
    type: mark
    codepoint: 0DD9
    translit: e (kombuwa)
    position: body
    stage: 3
    order: 6
    parents: [ග]
    spacing: {left: L-ga}
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: >
        The pre-base spacing mark; its left profile belongs to the L-ga class
        (source groups ෙ with ග ඟ ඤ ඥ …), so it follows ග.
      checks: ["ෙ + base spacing consistent across L classes; never collides with L-e entries."]

  ං:
    type: sign
    codepoint: 0D82
    translit: anusvaraya (binduva)
    stage: 3
    order: 7
    parents: []
    requires: [counter]
    level: sinhala-0-kernel
    frequency: high
    ai:
      construction: "A filled/open dot at base height — trivial, very frequent, and needed for real words (ගං, සං-)."
      checks: ["Optically round; weight matches stroke, not geometry."]

  fam-i-ghi:
    type: form-family
    display: සි (ඝි)
    mark: ි
    hosts: [ඝ, ස]
    stage: 3
    order: 8
    parents: [ස, ි]
    level: sinhala-0-kernel
    ai:
      construction: >
        The ඝි-family convention introduced by its first DESIGNED member — සි
        (the family key ඝ only arrives in Stage 6 and inherits). Demonstrates
        the representative-introduces-family principle.
      checks: ["සි reads as one glyph; convention transferable to ඝ later."]

  hal-rahena:
    type: form-family
    display: ට් ඩ් (ම් බ් …)
    mark: ්
    hosts: [ට, ඩ, ඬ, ච, ධ, ඛ, බ, ම, ඹ, ව, ඣ, ඞ]
    stage: 3
    order: 9
    parents: [්, ට]
    level: sinhala-0-kernel
    ai:
      construction: >
        The RAHENA ් form: on bases with a TOP TERMINAL the kodiya flag
        cannot land, so ් wraps the terminal and the pair fuses into one
        glyph (Noto: tt-sinh, m-sinh …). Introduced on ට්. ර් belongs to
        ra-forms, not here. ඔ ඕ share the top terminal visually but, being
        independent vowels, never take ්.
      checks: ["One wrap convention across all hosts; kodiya/rahena assignment table complete."]

  hal-trap:
    type: form-family
    display: ඪ් (ඨ් ථ් ඵ්)
    mark: ්
