# -----------------------------------------------------------------------------
# Open gaps carried from the source taxonomy + concerns raised in review.
# These are DATA: the build prints them and renders them on the page.
# -----------------------------------------------------------------------------
gaps:
  - id: i-unassigned-hosts
    text: "RESOLVED via Noto evidence: the formerly-unassigned ි hosts (ම ය ව බ ඛ ධ ණ …) are fused top-terminal wrap hosts — now fam-i-term. Kept here as a record of how the gap was closed (extract-noto.js diff, 2026-07-17)."
  - id: pu-empty
    text: "RESOLVED via Noto: ප is in none of Noto's ු-alternate classes (uSignAlt1/2/3) nor its u_fused set, so it takes the DEFAULT ු — no special form. The empty පු group in the source taxonomy was correct; the draft's duplicate පු was spurious."
  - id: du-classification
    text: "RESOLVED via Noto: ද is in Noto's u_fused set (දු = the fused dU glyph), so the model's du-form (its own one-host ු family) is correct. The source taxonomy's filing under the ග්‍රි (conjunct-ි) group was a mis-file — දු concerns ු, not conjunct-ි."
  - id: side-overlaps
    text: "RESOLVED (confirmed): the source side-family/shape overlaps are settled by the spacing classes — ධ ච ඩ ඣ → R-bowl (with ට), dropped from R-round; ස → L-e (eye-line, its rep), dropped from L-pa; ර ඊ → the ර/diagonal family (R-diag, L-ja), dropped from the ප shape group."
  - id: taxonomy-holes
    text: "RESOLVED (confirmed): ථ → trap/එ family (skeleton trap_body, R-trap; Noto phaShapeGroup agrees); ඣ → bowl/ට family (skeleton bowl + twin_body element, R-bowl). Source docs/sinhala-shape-groups.yaml cleaned: ථ added to the එ group, ඣ to the ට group, ප added to its own ප group, and the duplicate ජ/ඦ removed from the diagonal element list."
  - id: density-incomplete
    text: "DEFERRED (future work): density is not consumed by the model, and the source classes cover only ~20 letters (high/medium/low). To close: complete the density classification for all bases in docs/sinhala-shape-groups.yaml, then decide whether the model should use density (e.g. as a drill-ordering or contrast-check dimension)."
  - id: level-tags
    text: "RESOLVED: every codepoint-bearing glyph was cross-checked against glyphsets/*.yaml — 80/80 now consistent. Fixes: ඥ ඦ ඍ → core and ෟ ෳ → kernel (model tags); ඟ promoted to kernel and ඦ/nyja added to core, plus four blank sign unicodes filled (ෟ ෳ ෲ ෴), in the glyphsets."
  - id: fam-i-pi-source
    text: "RESOLVED (confirmed): fam-i-pi is the DEFAULT ි for its hosts ප ෂ — Noto puts neither (nor ක්‍ෂ) in any iVowelAlt class, so no special atomic form is needed. The source row's repeats and ක්‍ෂි were already dropped; membership [ප, ෂ] confirmed."
  - id: ndi-o-forms
    text: "RESOLVED: the ඳි family in the source mixed in ො forms (ඳො ඳ්‍රො) — a data error; those ො forms are excluded from fam-i-ndi here."
  - id: frequency-unmeasured
    text: "DEFERRED (future work): frequency tags are qualitative. To close: compute per-stage cumulative corpus coverage from a representative Sinhala corpus (the standard texture paragraph is a starting sample) and use it to validate/adjust the Stage-4/6 gate boundaries. Ties into the planned texture_texts integration."
  - id: u-system-noto
    text: "RESOLVED (decided): keep the model minimal — default ු + the small fused set (u-special ක ග ත භ ශ ඟ, du-form ද, llu-form ළ). Noto's richer system (extra fused ඤු ඥු ඳු ලු + the alt1/alt2/alt3 contextual tiers) stays documented in docs/sinhala.min.yaml as a per-project opt-in, not folded into the baseline."
