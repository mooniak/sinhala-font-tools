meta:
  source: >-
    docs/NotoSansSinhala.glyphspackage (Copyright 2022 The Noto Project Authors,
    github.com/notofonts/sinhala)
  extracted_by: extract-noto.js — regenerate with `node extract-noto.js`; never hand-edit
  reading: >-
    Noto processes each mark through a THREE-tier system: default mark form, contextual alternate
    mark form (per class), or a fully fused ligature glyph. Fused sets correspond to what our model
    calls atomic form families; virama_fused is the rahena-type wrap set (bases with a top
    terminal), virama default is the kodiya (flag).
