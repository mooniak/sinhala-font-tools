<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Comparison Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="controls">
            <div class="input-group">
                <label for="text-input">Text to Display:</label>
                <input type="text" id="text-input" value="Ag" placeholder="Enter text or single glyph">
            </div>
            
            <div class="input-group">
                <label for="size-slider">Size:</label>
                <input type="range" id="size-slider" min="24" max="400" value="72">
                <span id="size-display">72px</span>
            </div>
            
            <div class="input-group">
                <label for="spacing-slider">Letter Spacing:</label>
                <input type="range" id="spacing-slider" min="-20" max="50" value="0">
                <span id="spacing-display">0px</span>
            </div>
            
            <div class="input-group">
                <label for="tile-spacing-slider">Tile Spacing:</label>
                <input type="range" id="tile-spacing-slider" min="0" max="40" value="20">
                <span id="tile-spacing-display">20px</span>
            </div>
            
            <div class="input-group">
                <label>
                    <input type="checkbox" id="show-names" checked>
                    Show Font Names
                </label>
            </div>
            
            <div class="view-controls">
                <button id="gallery-view" class="view-btn active">Gallery</button>
                <button id="thumbnail-view" class="view-btn">Thumbnails</button>
                <button id="compare-view" class="view-btn">Compare</button>
            </div>
        </header>

        <div class="drop-zone" id="drop-zone">
            <div class="drop-message">
                <p>Drag and drop font files here (.ttf, .otf, .woff, .woff2)</p>
                <p>or click to browse</p>
                <input type="file" id="file-input" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
            </div>
        </div>

        <div class="font-display-area">
            <div id="gallery-container" class="view-container active">
                <div class="gallery-nav">
                    <button id="prev-btn" class="nav-btn">‹</button>
                    <span id="font-counter">0 / 0</span>
                    <button id="next-btn" class="nav-btn">›</button>
                </div>
                <div id="gallery-display" class="gallery-display"></div>
            </div>

            <div id="thumbnail-container" class="view-container">
                <div id="thumbnail-grid" class="thumbnail-grid"></div>
            </div>

            <div id="compare-container" class="view-container">
                <div id="compare-grid" class="compare-grid"></div>
            </div>
        </div>

        <div class="font-list">
            <h3>Loaded Fonts</h3>
            <ul id="font-list"></ul>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="default-fonts.js"></script>
    <script src="app.js"></script>
</body>
</html>
