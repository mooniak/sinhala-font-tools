flags:
  ො: 'Standalone-glyph view (mark row in charts): left = kombuwa entry, right = the ා stem. In running
    text the font decomposes it to ෙ + base + ා, each half keeping its own class.'
  ෝ: Same standalone-glyph caveat as ො; the ් flag rides the ා stem and should not change the right edge.
  ෲ: 'FLAG: assumes the doubled loop keeps ෘ''s entry and terminal — verify.'
  ෳ: 'FLAG: assumes the length stroke ends in the ා/ෟ-style terminal (R-arch) — verify.'
  ෞ: Same standalone-glyph caveat as ො; right = the ෟ tail's terminal.
  ඎ: 'FLAG: inherited from ඍ; assumes the length element stays inside ඍ''s right terminal — verify.'
  ඏ: 'FLAG (low confidence): right R-u guesses the bottom curl reads like the ද/උ hook family — the taxonomy
    only assigned the left; verify with designer.'
  ඐ: 'FLAG (low confidence): inherited from ඏ; both sides carry ඏ''s uncertainty plus the length element
    — verify.'
  ඓ: 'FLAG: assumes the එ-system derivation holds at both edges (extra element stays on top) — verify
    with designer.'
  ඖ: 'FLAG: left follows ඔ; right R-arch assumes the trailing tail ends in the ා/ෟ-style terminal (as
    ඕ does) — verify.'
